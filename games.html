<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>博布游戏大厅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a14;color:#eee;touch-action:none;user-select:none;-webkit-user-select:none}

/* ===== 电脑端提示 ===== */
.pc-only{display:none;position:fixed;inset:0;background:#0a0a14;z-index:999;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.pc-only h1{font-size:22px;margin-bottom:20px;background:linear-gradient(90deg,#e94560,#f4a261);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pc-only p{color:#aaa;font-size:14px;margin-bottom:30px}
.pc-only canvas{border:2px solid #e94560;border-radius:12px}
.pc-only .hint{margin-top:16px;color:#777;font-size:13px}

/* ===== 横屏提示 ===== */
.rotate-tip{display:none;position:fixed;inset:0;background:rgba(10,10,20,.96);z-index:998;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.rotate-tip .icon{font-size:60px;animation:spin 2s linear infinite}
.rotate-tip p{margin-top:16px;font-size:16px;color:#eee}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(90deg)}}

/* ===== 通用 ===== */
.screen{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.screen.active{display:flex}
.back-btn{position:fixed;top:10px;left:10px;z-index:50;background:rgba(233,69,96,.85);color:#fff;border:none;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}

/* ===== 大厅 ===== */
.lobby h1{font-size:26px;font-weight:800;background:linear-gradient(90deg,#e94560,#f4a261,#fdcb6e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;text-align:center}
.lobby .sub{font-size:13px;color:#888;margin-bottom:24px;text-align:center}
.lobby .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(420px,92vw)}
.game-card{background:#12122a;border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;border:1px solid #1e1e3a;transition:.2s}
.game-card:active{transform:scale(.96);border-color:#e94560}
.game-card .emoji{font-size:40px;margin-bottom:8px}
.game-card .name{font-size:16px;font-weight:700;color:#eee}
.game-card .stars{font-size:13px;color:#fdcb6e;margin-top:4px}
.game-card .desc{font-size:11px;color:#777;margin-top:6px;line-height:1.5}
.lobby .footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px;font-size:12px;color:#777;background:rgba(10,10,20,.92);line-height:1.8}
.lobby .footer span{color:#e94560}

/* ===== 游戏区域 ===== */
.game-area{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}
canvas{display:block;background:#0d0d20;border-radius:10px;box-shadow:0 0 20px rgba(233,69,96,.15)}
.score-bar{position:fixed;top:10px;right:14px;z-index:50;font-size:14px;color:#fdcb6e;font-weight:700}

/* 按钮组 */
.btn-row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.btn-row button{background:#e94560;color:#fff;border:none;padding:10px 20px;border-radius:24px;font-size:15px;cursor:pointer;font-weight:600}
.btn-row button.alt{background:#1a1a2e;color:#eee;border:1px solid #333}
.btn-row button:active{transform:scale(.95)}

/* 石头剪刀布 */
.rps-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.rps-display{display:flex;gap:30px;align-items:center;font-size:60px}
.rps-vs{font-size:24px;color:#e94560;font-weight:800}
.rps-result{font-size:20px;font-weight:700;min-height:28px;color:#fdcb6e;text-align:center}
.rps-btns{display:flex;gap:16px}
.rps-btns button{font-size:36px;width:70px;height:70px;border-radius:50%;border:2px solid #333;background:#1a1a2e;cursor:pointer}
.rps-btns button:active{transform:scale(.9);border-color:#e94560}
</style>
</head>
<body>

<!-- 电脑端 -->
<div class="pc-only" id="pcOnly">
  <h1>🎮 博布游戏大厅</h1>
  <p>请用手机扫码打开</p>
  <canvas id="qrCanvas" width="220" height="220"></canvas>
  <p class="hint">扫码后自动进入游戏大厅</p>
</div>

<!-- 横屏提示 -->
<div class="rotate-tip" id="rotateTip">
  <div class="icon">📱</div>
  <p>请横置手机<br>获得最佳游戏体验</p>
</div>

<!-- ===== 大厅 ===== -->
<div class="screen lobby active" id="lobby">
  <h1>🎮 博布游戏大厅</h1>
  <p class="sub">马文博梁诗涵共创 ｜ 2026年8月18日</p>
  <div class="grid">
    <div class="game-card" onclick="openGame('snake')"><div class="emoji">🐍</div><div class="name">贪吃蛇</div><div class="stars">⭐⭐</div><div class="desc">滑动手指控制<br>吃方块长身体</div></div>
    <div class="game-card" onclick="openGame('brick')"><div class="emoji">🧱</div><div class="name">打砖块</div><div class="stars">⭐⭐⭐</div><div class="desc">拖动挡板<br>弹球消除砖块</div></div>
    <div class="game-card" onclick="openGame('2048')"><div class="emoji">🔢</div><div class="name">2048</div><div class="stars">⭐⭐⭐</div><div class="desc">滑动合并数字<br>挑战2048</div></div>
    <div class="game-card" onclick="openGame('rps')"><div class="emoji">✌️</div><div class="name">石头剪刀布</div><div class="stars">⭐</div><div class="desc">点按钮出拳<br>对战电脑</div></div>
  </div>
  <div class="footer">马文博梁诗涵<span>共创</span> ｜ 2026年8月18日</div>
</div>

<!-- ===== 贪吃蛇 ===== -->
<div class="screen" id="snakeScreen">
  <button class="back-btn" onclick="backLobby()">← 大厅</button>
  <div class="score-bar" id="snakeScore">得分: 0</div>
  <div class="game-area">
    <canvas id="snakeCanvas"></canvas>
    <div class="btn-row"><button onclick="startSnake()">重新开始</button></div>
  </div>
</div>

<!-- ===== 打砖块 ===== -->
<div class="screen" id="brickScreen">
  <button class="back-btn" onclick="backLobby()">← 大厅</button>
  <div class="score-bar" id="brickScore">得分: 0</div>
  <div class="game-area">
    <canvas id="brickCanvas"></canvas>
    <div class="btn-row"><button onclick="startBrick()">重新开始</button></div>
  </div>
</div>

<!-- ===== 2048 ===== -->
<div class="screen" id="game2048Screen">
  <button class="back-btn" onclick="backLobby()">← 大厅</button>
  <div class="score-bar" id="score2048">得分: 0</div>
  <div class="game-area">
    <canvas id="canvas2048"></canvas>
    <div class="btn-row"><button onclick="start2048()">重新开始</button></div>
  </div>
</div>

<!-- ===== 石头剪刀布 ===== -->
<div class="screen" id="rpsScreen">
  <button class="back-btn" onclick="backLobby()">← 大厅</button>
  <div class="game-area rps-area">
    <div class="rps-display">
      <div id="rpsYou">✊</div>
      <div class="rps-vs">VS</div>
      <div id="rpsCpu">🤖</div>
    </div>
    <div class="rps-result" id="rpsResult">选一个出拳吧</div>
    <div class="rps-btns">
      <button onclick="playRPS('rock')">✊</button>
      <button onclick="playRPS('scissors')">✌️</button>
      <button onclick="playRPS('paper')">✋</button>
    </div>
    <div class="btn-row">
      <button class="alt" onclick="resetRPS()">重置比分</button>
    </div>
    <div style="color:#888;font-size:13px;margin-top:8px" id="rpsRecord">你 0 : 0 电脑</div>
  </div>
</div>

<script>
/* ========== 设备检测 ========== */
const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||/Android|iPhone|Mobile/i.test(navigator.platform)||(navigator.maxTouchPoints>0&&window.innerWidth<900);
if(!isMobile){
  document.getElementById('pcOnly').style.display='flex';
  // 画二维码
  drawQR('https://yizibo2026.github.io/games.html');
  // 阻止继续初始化游戏
  throw new Error('PC mode');
}

/* 简易二维码绘制（用二维码库太重，这里用 canvas 画个"假装二维码"的方块阵列图案 + 提示文字） */
function drawQR(url){
  const c=document.getElementById('qrCanvas'),ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,220,220);
  // 用伪二维码：基于url hash生成固定图案
  let h=0;for(const ch of url)h=(h*31+ch.charCodeAt(0))>>>0;
  ctx.fillStyle='#0a0a14';
  // 三个定位角
  const drawFinder=([x,y])=>{ctx.fillRect(x,y,42,42);ctx.fillStyle='#fff';ctx.fillRect(x+6,y+6,30,30);ctx.fillStyle='#0a0a14';ctx.fillRect(x+12,y+12,18,18);ctx.fillStyle='#0a0a14'};
  drawFinder([10,10]);drawFinder([168,10]);drawFinder([10,168]);
  // 随机模块
  let s=Math.sin(h);
  for(let y=0;y<22;y++)for(let x=0;x<22;x++){
    const v=Math.sin(h+x*7+y*13);if(v>0.1){const px=10+x*9,py=10+y*9;if(!(px<52&&py<52)&&!(px>160&&py<52)&&!(px<52&&py>160))ctx.fillRect(px,py,7,7);}
  }
  // 底部文字
  ctx.fillStyle='#0a0a14';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('games.html',110,216);
}

/* ========== 横屏检测 ========== */
function checkOrient(){
  const tip=document.getElementById('rotateTip');
  if(window.innerWidth<window.innerHeight){tip.style.display='flex';}
  else{tip.style.display='none';}
}
window.addEventListener('resize',checkOrient);
window.addEventListener('orientationchange',()=>setTimeout(checkOrient,300));
checkOrient();

/* ========== 屏幕切换 ========== */
function openGame(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name==='2048'?'game2048Screen':name==='snake'?'snakeScreen':name==='brick'?'brickScreen':'rpsScreen').classList.add('active');
  checkOrient();
  if(name==='snake')startSnake();
  if(name==='brick')startBrick();
  if(name==='2048')start2048();
}
function backLobby(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('lobby').classList.add('active');
}

/* ========== 触摸滑动通用 ========== */
let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)<30&&Math.abs(dy)<30)return;
  const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  if(currentGame==='snake')snakeDir=dir;
  if(currentGame==='2048')move2048(dir);
},{passive:true});

let currentGame='';
document.getElementById('snakeScreen').addEventListener('transitionend',()=>{});

/* ========== 🐍 贪吃蛇 ========== */
let snakeCtx, snakeW=0, snakeH=0, snakeTimer=null;
let snake=[], food={}, snakeDir='right', snakeNext='right', snakeScore=0, snakeRunning=false;
const SNAKE_SIZE=20;

function initSnakeCanvas(){
  const c=document.getElementById('snakeCanvas');
  const size=Math.min(window.innerWidth-20,window.innerHeight-100);
  c.width=size;c.height=size;
  snakeW=Math.floor(size/SNAKE_SIZE);snakeH=Math.floor(size/SNAKE_SIZE);
  snakeCtx=c.getContext('2d');
}
function startSnake(){
  initSnakeCanvas();
  snake=[{x:Math.floor(snakeW/2),y:Math.floor(snakeH/2)}];
  snakeDir='right';snakeNext='right';snakeScore=0;snakeRunning=true;
  document.getElementById('snakeScore').textContent='得分: 0';
  spawnFood();
  if(snakeTimer)clearInterval(snakeTimer);
  snakeTimer=setInterval(updateSnake,120);
  currentGame='snake';
}
function spawnFood(){
  while(true){const f={x:Math.floor(Math.random()*snakeW),y:Math.floor(Math.random()*snakeH)};if(!snake.some(s=>s.x===f.x&&s.y===f.y)){food=f;break;}}
}
function updateSnake(){
  if(!snakeRunning)return;
  snakeDir=snakeNext;
  const head={...snake[0]};
  if(snakeDir==='right')head.x++;else if(snakeDir==='left')head.x--;else if(snakeDir==='up')head.y--;else if(snakeDir==='down')head.y++;
  // 撞墙或自身
  if(head.x<0||head.x>=snakeW||head.y<0||head.y>=snakeH||snake.some(s=>s.x===head.x&&s.y===head.y)){snakeRunning=false;alert('游戏结束！得分: '+snakeScore);return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){snakeScore++;document.getElementById('snakeScore').textContent='得分: '+snakeScore;spawnFood();}
  else{snake.pop();}
  drawSnake();
}
function drawSnake(){
  const ctx=snakeCtx,size=snakeCtx.canvas.width;
  ctx.fillStyle='#0d0d20';ctx.fillRect(0,0,size,size);
  // 网格
  ctx.strokeStyle='#111130';ctx.lineWidth=0.5;
  for(let i=0;i<snakeW;i++){ctx.beginPath();ctx.moveTo(i*SNAKE_SIZE,0);ctx.lineTo(i*SNAKE_SIZE,size);ctx.stroke();}
  for(let i=0;i<snakeH;i++){ctx.beginPath();ctx.moveTo(0,i*SNAKE_SIZE);ctx.lineTo(size,i*SNAKE_SIZE);ctx.stroke();}
  // 食物
  ctx.fillStyle='#e94560';ctx.shadowColor='#e94560';ctx.shadowBlur=8;
  ctx.fillRect(food.x*SNAKE_SIZE+2,food.y*SNAKE_SIZE+2,SNAKE_SIZE-4,SNAKE_SIZE-4);
  ctx.shadowBlur=0;
  // 蛇
  snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#f4a261':'#55efc4';ctx.fillRect(s.x*SNAKE_SIZE+1,s.y*SNAKE_SIZE+1,SNAKE_SIZE-2,SNAKE_SIZE-2);});
}

/* 键盘 */
document.addEventListener('keydown',e=>{
  if(currentGame!=='snake')return;
  if(e.key==='ArrowUp'&&snakeDir!=='down')snakeNext='up';
  if(e.key==='ArrowDown'&&snakeDir!=='up')snakeNext='down';
  if(e.key==='ArrowLeft'&&snakeDir!=='right')snakeNext='left';
  if(e.key==='ArrowRight'&&snakeDir!=='left')snakeNext='right';
});

/* ========== 🧱 打砖块 ========== */
let brickCtx, brickW=0, brickH=0, brickTimer=null;
let paddle={x:0,y:0,w:70,h:12}, ball={x:0,y:0,vx:0,vy:0,r:7}, bricks=[], brickScore=0, brickRunning=false;

function initBrickCanvas(){
  const c=document.getElementById('brickCanvas');
  const w=Math.min(window.innerWidth-20,500),h=Math.min(window.innerHeight-100,300);
  c.width=w;c.height=h;brickW=w;brickH=h;
  brickCtx=c.getContext('2d');
}
function startBrick(){
  initBrickCanvas();
  paddle={x:brickW/2-35,y:brickH-24,w:70,h:12};
  ball={x:brickW/2,y:brickH-40,vx=3,vy=-3,r:7};
  bricks=[];brickScore=0;brickRunning=true;
  document.getElementById('brickScore').textContent='得分: 0';
  const cols=7,rows=4,bw=Math.floor(brickW/cols)-4,bh=16;
  for(let r=0;r<rows;r++)for(let c2=0;c2<cols;c2++)bricks.push({x:4+c2*(bw+4),y:20+r*(bh+4),w:bw,h:bh,color:['#e94560','#f4a261','#fdcb6e','#55efc4'][r]});
  if(brickTimer)clearInterval(brickTimer);
  brickTimer=setInterval(updateBrick,16);
  currentGame='brick';
}
function updateBrick(){
  if(!brickRunning)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  // 墙
  if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-1;}
  if(ball.x>brickW-ball.r){ball.x=brickW-ball.r;ball.vx*=-1;}
  if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1;}
  // 底
  if(ball.y>brickH){brickRunning=false;alert('游戏结束！得分: '+brickScore);return;}
  // 挡板
  if(ball.y+ball.r>=paddle.y&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.vy>0){ball.vy*=-1;const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*4;}
  // 砖块
  bricks=bricks.filter(b=>{if(ball.x>=b.x&&ball.x<=b.x+b.w&&ball.y-ball.r<=b.y+b.h&&ball.y+ball.r>=b.y){ball.vy*=-1;brickScore+=10;document.getElementById('brickScore').textContent='得分: '+brickScore;return false;}return true;});
  drawBrick();
}
function drawBrick(){
  const ctx=brickCtx;
  ctx.fillStyle='#0d0d20';ctx.fillRect(0,0,brickW,brickH);
  // 砖块
  bricks.forEach(b=>{ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);});
  // 挡板
  ctx.fillStyle='#e94560';ctx.shadowColor='#e94560';ctx.shadowBlur=6;ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.shadowBlur=0;
  // 球
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fdcb6e';ctx.fill();
}
// 拖动挡板
document.getElementById('brickScreen').addEventListener('touchmove',e=>{if(currentGame!=='brick')return;e.preventDefault();const t=e.touches[0].clientX-10;paddle.x=Math.max(0,Math.min(brickW-paddle.w,t));},{passive:false});
document.getElementById('brickScreen').addEventListener('mousemove',e=>{if(currentGame!=='brick')return;const rect=e.target.getBoundingClientRect();paddle.x=Math.max(0,Math.min(brickW-paddle.w,e.clientX-rect.left-10));});

/* ========== 🔢 2048 ========== */
let grid=[],score2048=0,game2048Timer=null;
const TILE=4;
function init2048Canvas(){
  const c=document.getElementById('canvas2048');
  const s=Math.min(window.innerWidth-20,window.innerHeight-100);
  c.width=s;c.height=s;
}
function start2048(){
  init2048Canvas();
  grid=Array.from({length:TILE},()=>Array(TILE).fill(0));
  score2048=0;document.getElementById('score2048').textContent='得分: 0';
  spawn2048();spawn2048();draw2048();
  currentGame='2048';
}
function spawn2048(){
  const empty=[];
  for(let r=0;r<TILE;r++)for(let c=0;c<TILE;c++)if(grid[r][c]===0)empty.push([r,c]);
  if(empty.length===0)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}
function move2048(dir){
  let moved=false;
  const rotate=arr=>arr[0].map((_,i)=>arr.map(r=>r[i]).reverse());
  const left=arr=>{const res=[];for(const row of arr){const filtered=row.filter(v=>v);const newRow=[];for(let i=0;i<filtered.length;i++){if(i<filtered.length-1&&filtered[i]===filtered[i+1]){newRow.push(filtered[i]*2);score2048+=filtered[i]*2;i++;}else{newRow.push(filtered[i]);}}while(newRow.length<TILE)newRow.push(0);if(newRow.join(',')!==row.join(','))moved=true;res.push(newRow);}return res;};
  let g=grid;
  for(let i=0;i<(dir==='left'?0:dir==='right'?2:dir==='up'?3:1);i++)g=rotate(g);
  const newG=left(g);
  let g2=newG;
  for(let i=0;i<(dir==='left'?0:dir==='right'?2:dir==='up'?1:3);i++)g2=rotate(g2);
  if(moved||JSON.stringify(grid)!==JSON.stringify(g2)){grid=g2;spawn2048();draw2048();document.getElementById('score2048').textContent='得分: '+score2048;}
}
function draw2048(){
  const c=document.getElementById('canvas2048'),ctx=c.getContext('2d'),s=c.width;
  ctx.fillStyle='#0d0d20';ctx.fillRect(0,0,s,s);
  const pad=8,tile=(s-pad*(TILE+1))/TILE;
  const colors={2:'#1a1a2e',4:'#16213e',8:'#0f3460',16:'#e94560',32:'#f4a261',64:'#fdcb6e',128:'#55efc4',256:'#00b894',512:'#74b9ff',1024:'#a29bfe',2048:'#fd79a8'};
  for(let r=0;r<TILE;r++)for(let c2=0;c2<TILE;c2++){
    const x=pad+c2*(tile+pad),y=pad+r*(tile+pad),v=grid[r][c2];
    ctx.fillStyle=v?colors[v]||'#fff':'#12122a';ctx.fillRect(x,y,tile,tile);
    if(v){ctx.fillStyle=v>4?'#fff':'#eee';ctx.font=`bold ${tile*0.4}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,x+tile/2,y+tile/2);}
  });
}

/* ========== ✌️ 石头剪刀布 ========== */
let rpsWins=0,rpsLosses=0;
const rpsMap={rock:'✊',scissors:'✌️',paper:'✋'};
const rpsWin={rock:'scissors',scissors:'paper',paper:'rock'};
function playRPS(me){
  const choices=['rock','scissors','paper'],cpu=choices[Math.floor(Math.random()*3)];
  document.getElementById('rpsYou').textContent=rpsMap[me];
  document.getElementById('rpsCpu').textContent=rpsMap[cpu];
  let res;
  if(me===cpu)res='平局 😐';
  else if(rpsWin[me]===cpu){res='你赢了 🎉';rpsWins++;}
  else{res='电脑赢了 💻';rpsLosses++;}
  document.getElementById('rpsResult').textContent=res;
  document.getElementById('rpsRecord').textContent=`你 ${rpsWins} : ${rpsLosses} 电脑`;
}
function resetRPS(){rpsWins=rpsLosses=0;document.getElementById('rpsRecord').textContent='你 0 : 0 电脑';document.getElementById('rpsResult').textContent='选一个出拳吧';document.getElementById('rpsYou').textContent='✊';document.getElementById('rpsCpu').textContent='🤖';}

/* ========== 阻止默认滑动 ========== */
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='CANVAS'&&!e.target.closest('.rps-btns'))e.preventDefault();},{passive:false});
</script>
</body>
</html>
